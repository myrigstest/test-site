<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meie Päev — Haldus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{cream:"#f8f5f0",ink:"#28322a",sage:"#889080"},fontFamily:{display:["Georgia","serif"]}}}}</script>
  </head>
  <body class="bg-cream font-sans text-ink">
    <main class="mx-auto max-w-6xl px-5 py-10">
      <section id="login-view" class="mx-auto mt-16 max-w-md bg-white p-8 shadow-sm"><p class="text-xs uppercase tracking-[.2em] text-sage">Meie Päev</p><h1 class="mt-2 font-display text-4xl">Haldus</h1>
        <form id="login-form" class="mt-8 grid gap-5"><label class="text-sm">Kasutajanimi<input required name="username" autocomplete="username" class="mt-2 w-full border p-3" /></label><label class="text-sm">Parool<input required type="password" name="password" autocomplete="current-password" class="mt-2 w-full border p-3" /></label><p id="login-error" class="hidden text-sm text-red-700" role="alert"></p><button class="bg-ink px-5 py-3 text-sm text-white">Sisene</button></form>
      </section>
      <section id="admin-view" class="hidden">
        <header class="flex flex-wrap items-center justify-between gap-4 border-b border-ink/15 pb-6"><div><p class="text-xs uppercase tracking-[.2em] text-sage">Meie Päev</p><h1 class="font-display text-4xl">Haldus</h1></div><button id="logout" class="border border-ink px-4 py-2 text-sm">Logi välja</button></header>
        <nav class="mt-8 flex gap-3" aria-label="Haldusmenüü"><button class="tab bg-ink px-4 py-2 text-sm text-white" data-panel="calendar">Kalender</button><button class="tab border border-ink px-4 py-2 text-sm" data-panel="editor">Redaktor</button></nav>
        <section id="calendar" class="panel mt-8"><div class="flex items-center justify-between"><button id="previous-month" class="p-2 text-xl" aria-label="Eelmine kuu">‹</button><h2 id="month-title" class="font-display text-3xl"></h2><button id="next-month" class="p-2 text-xl" aria-label="Järgmine kuu">›</button></div><div class="mt-6 grid grid-cols-7 gap-1 text-center text-xs text-ink/60"><span>E</span><span>T</span><span>K</span><span>N</span><span>R</span><span>L</span><span>P</span></div><div id="calendar-grid" class="mt-2 grid grid-cols-7 gap-1"></div><div class="mt-8 border-t border-ink/15 pt-6"><h3 id="selected-date" class="font-display text-2xl">Valige kuupäev</h3><div id="booking-list" class="mt-4 text-sm text-ink/70">Valige kalendrist päev, et näha broneeringuid.</div></div></section>
        <section id="editor" class="panel mt-8 hidden"><h2 class="font-display text-3xl">Lehe tekstid</h2><p class="mt-2 text-sm text-ink/70">Muudatused avaldatakse saidil kohe pärast salvestamist.</p><form id="content-form" class="mt-8 grid max-w-2xl gap-5"><label class="text-sm">Hero eelteade<input data-key="hero_eyebrow" class="mt-2 w-full border bg-white p-3" /></label><label class="text-sm">Hero pealkiri<textarea data-key="hero_title" class="mt-2 w-full border bg-white p-3"></textarea></label><label class="text-sm">Hero nupp<input data-key="hero_cta" class="mt-2 w-full border bg-white p-3" /></label><label class="text-sm">Broneeringu pealkiri<textarea data-key="booking_title" class="mt-2 w-full border bg-white p-3"></textarea></label><label class="text-sm">Broneeringu tekst<textarea data-key="booking_text" class="mt-2 w-full border bg-white p-3"></textarea></label><p id="editor-status" class="hidden text-sm" role="status"></p><button class="w-fit bg-ink px-5 py-3 text-sm text-white">Salvesta muudatused</button></form></section>
      </section>
    </main>
    <script>
      const $ = selector => document.querySelector(selector); let bookings = [], content = {}, month = new Date(); month.setDate(1);
      const dayFormatter = new Intl.DateTimeFormat("et-EE", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
      async function api(path, options) { const response = await fetch(path, options); if (response.status === 401) throw new Error("unauthorized"); if (!response.ok) throw new Error("request"); return response.status === 204 ? null : response.json(); }
      function showAdmin() { $("#login-view").classList.add("hidden"); $("#admin-view").classList.remove("hidden"); }
      function renderCalendar() { const title = new Intl.DateTimeFormat("et-EE", { month: "long", year: "numeric" }).format(month); $("#month-title").textContent = title[0].toUpperCase() + title.slice(1); const grid = $("#calendar-grid"); grid.replaceChildren(); const offset = (month.getDay() + 6) % 7, days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate(); for (let i = 0; i < offset; i++) grid.append(document.createElement("span")); for (let day = 1; day <= days; day++) { const date = `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`, count = bookings.filter(item => item.event_date === date).length, button = document.createElement("button"); button.className = `min-h-12 border p-1 text-sm hover:bg-sage hover:text-white ${count ? "bg-ink text-white" : "bg-white"}`; button.innerHTML = `<span>${day}</span>${count ? `<small class="block">${count} br.</small>` : ""}`; button.onclick = () => showBookings(date); grid.append(button); } }
      function showBookings(date) { $("#selected-date").textContent = dayFormatter.format(new Date(`${date}T12:00:00`)); const matches = bookings.filter(item => item.event_date === date); $("#booking-list").replaceChildren(...(matches.length ? matches.map(item => { const article = document.createElement("article"), name = document.createElement("strong"), separator = document.createTextNode(" · "), email = document.createElement("a"), message = document.createElement("p"); article.className = "mb-3 bg-white p-4"; name.textContent = item.name; email.className = "underline"; email.href = `mailto:${item.email}`; email.textContent = item.email; message.className = "mt-2 whitespace-pre-wrap"; message.textContent = item.message; article.append(name, separator, email, message); return article; }) : [Object.assign(document.createElement("p"), { textContent: "Sellel kuupäeval broneeringuid ei ole." })])); }
      async function loadAdmin() { try { [bookings, content] = await Promise.all([api("/api/bookings"), api("/api/content")]); showAdmin(); document.querySelectorAll("[data-key]").forEach(field => field.value = content[field.dataset.key] || ""); renderCalendar(); } catch { $("#login-view").classList.remove("hidden"); } }
      $("#login-form").onsubmit = async event => { event.preventDefault(); const error = $("#login-error"), data = Object.fromEntries(new FormData(event.currentTarget)); try { await api("/api/auth/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) }); await loadAdmin(); } catch { error.textContent = "Vale kasutajanimi või parool."; error.classList.remove("hidden"); } };
      document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => { document.querySelectorAll(".panel").forEach(panel => panel.classList.toggle("hidden", panel.id !== tab.dataset.panel)); document.querySelectorAll(".tab").forEach(button => button.className = `tab px-4 py-2 text-sm ${button === tab ? "bg-ink text-white" : "border border-ink"}`); });
      $("#previous-month").onclick = () => { month.setMonth(month.getMonth()-1); renderCalendar(); }; $("#next-month").onclick = () => { month.setMonth(month.getMonth()+1); renderCalendar(); };
      $("#content-form").onsubmit = async event => { event.preventDefault(); const status=$("#editor-status"), values=Object.fromEntries([...document.querySelectorAll("[data-key]")].map(field=>[field.dataset.key,field.value])); try { await api("/api/content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(values)}); status.textContent="Muudatused salvestati."; status.className="text-sm text-green-700"; } catch { status.textContent="Salvestamine ebaõnnestus."; status.className="text-sm text-red-700"; } };
      $("#logout").onclick = async () => { await api("/api/auth/logout",{method:"POST"}); location.reload(); }; loadAdmin();
    </script>
  </body>
</html>
